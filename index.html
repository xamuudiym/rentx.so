<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8f5">
    <meta name="description" content="Manage Mogadishu rentals, bookings and property operations with RentX.">
    <title>RentX — Mogadishu rentals</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#" data-view="dashboard" aria-label="RentX dashboard">
          <span class="brand-mark">r<span>.</span></span>
          <span class="brand-name">rentx<span>.so</span><small>MOGADISHU RENTALS</small></span>
        </a>
        <div class="sidebar-caption" data-i18n="WORKSPACE">WORKSPACE</div>
        <nav id="navigation" class="navigation"></nav>
        <div class="sidebar-bottom">
          <div class="support-card">
            <span class="support-icon">✳</span>
            <div><strong data-i18n="Need a hand?">Need a hand?</strong><span data-i18n="Ask your RentX assistant">Ask your RentX assistant</span></div>
            <button class="support-arrow" data-view="assistant" aria-label="Open assistant">↗</button>
          </div>
          <div class="sidebar-user">
            <span class="avatar avatar-dark">RX</span>
            <div class="user-copy"><strong>RentX Workspace</strong><span id="role-label">Administrator</span></div>
            <button class="icon-button" id="role-menu" aria-label="Change preview role">•••</button>
          </div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="mobile-brand"><span class="brand-mark">r<span>.</span></span><strong>rentx<span>.so</span></strong></div>
          <div class="breadcrumb"><span data-i18n="mogadishu">Mogadishu</span><span class="crumb-dot">/</span><strong id="page-crumb">Overview</strong></div>
          <div class="top-actions">
            <label class="search-box"><span aria-hidden="true">⌕</span><input id="global-search" type="search" placeholder="Search properties, tenants…" aria-label="Search properties and tenants"></label>
            <span class="location-chip"><span class="online-dot"></span><span data-i18n="Workspace">Workspace</span></span>
            <button id="language-toggle" class="language-toggle" aria-label="Switch language">SO</button>
            <button id="top-role-menu" class="icon-button top-role-menu" aria-label="Change preview role">◉</button>
            <button id="settings-button" class="icon-button settings-button" data-view="settings" aria-label="Settings">⚙</button>
          </div>
        </header>
        <section id="app-content" class="content" aria-live="polite"></section>
      </main>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
  </body>
</html>http.server 4173
